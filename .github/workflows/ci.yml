# =============================================================================
# .github/workflows/ci.yml — BRSDK Python SDK Continuous Integration
#
# Triggers: every push to main and every pull request targeting main.
# Jobs run in parallel across the matrix; all must pass for PR merge.
#
# Three jobs:
#   quality  — ruff lint + ruff format check + mypy (fast, no install extras)
#   test     — pytest with coverage across OS × Python matrix
#   build    — verify the wheel and sdist build cleanly (packaging smoke test)
# =============================================================================

name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "python/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "python/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: python

jobs:
  quality:
    name: "Quality — ruff & mypy"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "python/pyproject.toml"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: uv sync --extra dev

      - name: Ruff — lint
        run: uv run ruff check src/ tests/

      - name: Ruff — format check
        run: uv run ruff format --check src/ tests/

      - name: Mypy — strict type check
        run: uv run mypy src/brsdk

  test:
    name: "Test — Python ${{ matrix.python-version }} / ${{ matrix.os }}"
    needs: quality
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "python/pyproject.toml"
          cache-suffix: ${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: uv sync --extra dev

      - name: Run pytest with coverage
        run: >-
          uv run pytest
          --cov=brsdk
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          tests/

      - name: Upload coverage report to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: python/coverage.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: "Build — ${{ matrix.os }}"
    needs: quality
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "python/pyproject.toml"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Verify build artefacts exist
        shell: python
        run: |
          import pathlib, sys
          dist = pathlib.Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          if not wheels:
              print("ERROR: No wheel found in dist/", file=sys.stderr)
              sys.exit(1)
          if not sdists:
              print("ERROR: No sdist found in dist/", file=sys.stderr)
              sys.exit(1)
          print(f"OK: {len(wheels)} wheel(s), {len(sdists)} sdist(s)")
          for f in sorted(dist.iterdir()):
              print(f"  {f.name}")

      - name: Upload build artefacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: python/dist/
          retention-days: 7
