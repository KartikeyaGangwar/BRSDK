# =============================================================================
# .github/workflows/paper.yml — JOSS Draft Paper Compilation
#
# Uses the official Open Journals action to compile paper.pdf from paper/paper.md
# whenever changes are pushed to paper/ or .github/workflows/paper.yml.
# =============================================================================

name: Draft Paper

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper:
    name: Generate JOSS Paper PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: joss-paper-pdf
          path: paper/paper.pdf
