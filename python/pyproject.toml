# =============================================================================
# pyproject.toml — BRSDK Python SDK
# Standards: PEP 517, PEP 518, PEP 621, PEP 639, PEP 561
# Build backend: Hatchling ≥ 1.27 (PEP 639 SPDX support requires ≥ 1.22)
# =============================================================================

[build-system]
# PEP 518: declare build-time dependencies.
# Hatchling is chosen over setuptools for its zero-config src-layout support,
# first-class PEP 639 SPDX licensing, and strong typing for plugins.
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

# =============================================================================
# Project metadata — PEP 621 canonical form
# =============================================================================
[project]
name = "brsdk"
version = "0.1.0"
description = "Python SDK for loading, inspecting, and analysing BRSDK telemetry datasets."

# Points to the package-level README which also serves as the PyPI long description.
readme = "README.md"

# SPEC 0: support Python versions released in the last 3 years.
# 3.10 released Oct 2021 — still within the 3-year window as of 2026.
requires-python = ">=3.10"

# PEP 639: SPDX expression in the `license` field; paired with `license-files`
# to point at the physical file on disk. The old `license = {file = "LICENSE"}`
# table form is deprecated under PEP 639.
license = "Apache-2.0"
license-files = ["LICENSE"]

authors = [
    { name = "BRSDK Team" },
]
maintainers = [
    { name = "BRSDK Team" },
]

# Trove classifiers used by PyPI for search and filtering.
# "Private :: Do Not Upload" would suppress publishing; we omit it intentionally.
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# Core runtime dependencies only.
# Per RFC-0001: Polars (compute engine) and Pydantic v2 (metadata boundary)
# are mandatory. PyArrow is the raw memory layer — Polars depends on it
# transitively, but we pin it explicitly so we can call pa.Table APIs directly.
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.5.0",
]

# =============================================================================
# Optional dependency groups ("extras") — pip install brsdk[ml]
# =============================================================================
[project.optional-dependencies]

# Machine-learning adapters: PyTorch tensor export and Minari offline-RL dataset
# creation. Both are large; they must never be required for the core load() path.
ml = [
    "torch>=2.1.0",
    "minari>=0.4.0",
]

# Visualisation: Matplotlib for static plots; Plotly for interactive HTML output.
viz = [
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
]

# Xarray adapter: optional because BRSDK's primary output is a Polars DataFrame.
# Xarray adds value for multidimensional spatial analyses (Digital Twin use-cases).
xarray = [
    "xarray>=2024.1.0",
]

# Developer toolchain: linting, type-checking, testing, and documentation.
# All pinned with lower bounds only to stay compatible with `uv` lock files
# managed by contributors.
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
    "mkdocs-material>=9.5.0",
    "build>=1.0.0",
]

# Convenience meta-extra: installs every optional group.
# Useful for local development environments and CI "full" matrix jobs.
all = [
    "brsdk[ml,viz,xarray,dev]",
]

# =============================================================================
# Project URLs — displayed on PyPI and referenced in SPEC 5 CITATION guidance
# =============================================================================
[project.urls]
Homepage     = "https://github.com/KartikeyaGangwar/BRSDK"
Repository   = "https://github.com/KartikeyaGangwar/BRSDK"
Documentation = "https://KartikeyaGangwar.github.io/BRSDK"
"Bug Tracker" = "https://github.com/KartikeyaGangwar/BRSDK/issues"
Changelog    = "https://github.com/KartikeyaGangwar/BRSDK/blob/main/python/CHANGELOG.md"

# =============================================================================
# Hatchling build configuration
# =============================================================================
[tool.hatch.build.targets.wheel]
# Tells Hatchling that source lives under src/, which is not its default.
# Without this, `hatch build` would not find the `brsdk` package.
packages = ["src/brsdk"]

[tool.hatch.build.targets.sdist]
# Include the top-level BRSDK documentation and licence assets in the sdist
# so that downstream packagers (conda-forge, Debian) have the full context.
include = [
    "src/",
    "tests/",
    "docs/",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
]

# =============================================================================
# PEP 561: marks the package as typed so mypy and pyright discover inline types
# without requiring a separate stub package. The empty `py.typed` marker file
# must also exist at src/brsdk/py.typed (created in Phase 0).
# =============================================================================

# =============================================================================
# Ruff — linter + formatter (replaces flake8, isort, black, pyupgrade)
# =============================================================================
[tool.ruff]
# Line length matches the de-facto standard for scientific Python projects.
line-length = 88

# Target the minimum supported Python version so Ruff can flag syntax that
# would fail on older interpreters and apply the correct UP (pyupgrade) rules.
target-version = "py310"

# Exclude auto-generated or vendored directories from analysis.
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    "__pycache__",
    "dist",
    "build",
    "docs/",
]

[tool.ruff.lint]
# Rule sets selected:
#   E / W  — PEP 8 style errors and warnings (pycodestyle)
#   F      — Pyflakes (undefined names, unused imports)
#   I      — isort-compatible import ordering
#   UP     — pyupgrade (modernise syntax for target-version)
#   B      — flake8-bugbear (likely bugs and design issues)
#   SIM    — flake8-simplify (unnecessary complexity)
#   ANN    — flake8-annotations (enforces type annotations on public APIs)
#   D      — pydocstyle (docstring conventions — NumPy style)
#   RUF    — Ruff-native rules
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN", "D", "RUF"]

# D203 (one-blank-line-before-class) conflicts with D211.
# D213 (multi-line-summary-second-line) conflicts with D212.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
# NumPy docstring convention is the standard across the scientific Python stack
# (NumPy, SciPy, Pandas, scikit-learn). Adopt it for consistency.
convention = "numpy"

[tool.ruff.lint.isort]
# Ensures a blank line between stdlib, third-party, and local imports.
force-sort-within-sections = true
known-first-party = ["brsdk"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# =============================================================================
# Mypy — static type checker in strict mode
# =============================================================================
[tool.mypy]
# Analyse the installed package tree, not raw source, to catch installed-vs-
# source mismatches early.
python_version = "3.10"
strict = true

# Report errors as errors (not just warnings) for the packages we own.
# Third-party stubs may be absent; we use `ignore_missing_imports` for them.
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
disallow_untyped_calls = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

# Polars, PyArrow, and Pydantic all ship py.typed markers; mypy resolves them.
# If a third-party stub is unavailable, fail loudly rather than silently pass.
ignore_missing_imports = false

# Per-module overrides for dependencies that do not ship stubs.
# brsdk._loader is intentionally absent in Phase 0; it will be implemented
# in Phase 3. The TYPE_CHECKING guard in __init__.py prevents this import
# from executing at runtime, but mypy still resolves it statically.
[[tool.mypy.overrides]]
module = "brsdk._loader"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "minari.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

# =============================================================================
# Pytest — test runner
# =============================================================================
[tool.pytest.ini_options]
# Restrict test discovery to the tests/ directory; prevents accidental
# collection of example notebooks or documentation code snippets.
testpaths = ["tests"]

# Verbose output by default — scientific contributors prefer explicit pass/fail.
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
]

# Register custom marks used in the test suite. Declaring them here prevents
# pytest from emitting PytestUnknownMarkWarning.
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests requiring a live BRSDK dataset file",
]

# =============================================================================
# Coverage — pytest-cov configuration
# =============================================================================
[tool.coverage.run]
source = ["brsdk"]
branch = true
# Omit test files and the marker file from coverage accounting.
omit = ["tests/*", "src/brsdk/py.typed"]

[tool.coverage.report]
# Fail the coverage step if total line coverage falls below 90%.
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
    # Standard exclusions for defensive programming patterns.
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
