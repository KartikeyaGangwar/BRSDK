# =============================================================================
# .github/workflows/ci.yml — BRSDK Python SDK Continuous Integration
#
# Triggers: every push to main and every pull request targeting main.
# Jobs run in parallel across the matrix; all must pass for PR merge.
#
# Three jobs:
#   quality  — ruff lint + ruff format check + mypy (fast, no install extras)
#   test     — pytest with coverage across OS × Python matrix
#   build    — verify the wheel and sdist build cleanly (packaging smoke test)
#
# SPEC 8 note: action versions are pinned to tags here for readability.
# Before the first PyPI release, migrate all `uses:` lines to full SHA pins
# per the Scientific Python SPEC 8 supply-chain security recommendation.
# =============================================================================

name: CI

on:
  push:
    branches: ["main"]
    paths:
      # Only run CI when Python SDK files change, not when Lua scripts change.
      - "python/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "python/**"
      - ".github/workflows/ci.yml"

# Cancel in-progress runs for the same branch when a new commit is pushed.
# This prevents wasted runner minutes on stale pushes during rapid development.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # All `run:` steps execute from the python/ sub-directory where
    # pyproject.toml lives.
    working-directory: python

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Code quality (ruff + mypy)
  # Runs on a single fast runner — no matrix needed for static analysis.
  # Fails fast before the expensive test matrix starts.
  # ---------------------------------------------------------------------------
  quality:
    name: "Quality — ruff & mypy"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          # Pin uv version to keep CI deterministic.
          version: "0.4.x"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        # Install the package with the `dev` extra only.
        # No ml/viz extras needed for static analysis.
        run: uv sync --extra dev

      - name: Ruff — lint
        run: uv run ruff check src/ tests/

      - name: Ruff — format check
        run: uv run ruff format --check src/ tests/

      - name: Mypy — strict type check
        run: uv run mypy src/brsdk

  # ---------------------------------------------------------------------------
  # Job 2: Test matrix (pytest + coverage)
  # Runs on Ubuntu and Windows across all supported Python versions.
  # Windows is included because BRSDK users commonly run BeamNG on Windows
  # and may analyse datasets on the same machine.
  # ---------------------------------------------------------------------------
  test:
    name: "Test — Python ${{ matrix.python-version }} / ${{ matrix.os }}"
    needs: quality
    runs-on: ${{ matrix.os }}

    strategy:
      # Do not cancel sibling matrix jobs on first failure.
      # A failure on Windows/3.10 should not suppress results on Ubuntu/3.12.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.4.x"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        # Sync all extras so that optional-dependency import paths are
        # exercised in the test suite even though they are not used yet.
        run: uv sync --extra dev

      - name: Run pytest with coverage
        run: >-
          uv run pytest
          --cov=brsdk
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          tests/

      - name: Upload coverage report to Codecov
        # Only upload from Ubuntu to avoid duplicate coverage submissions.
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: python/coverage.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false
          # Token is optional for public repositories but recommended.
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Job 3: Build smoke test
  # Verifies that `uv build` produces a valid sdist and wheel on both OSes.
  # Does NOT publish to PyPI — that is a separate, manually triggered workflow.
  # ---------------------------------------------------------------------------
  build:
    name: "Build — ${{ matrix.os }}"
    needs: quality
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.4.x"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Verify build artefacts exist
        # Shell-agnostic artefact check: confirm dist/ contains at least one
        # .whl file and one .tar.gz file before the job exits.
        shell: python
        run: |
          import pathlib, sys
          dist = pathlib.Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          if not wheels:
              print("ERROR: No wheel found in dist/", file=sys.stderr)
              sys.exit(1)
          if not sdists:
              print("ERROR: No sdist found in dist/", file=sys.stderr)
              sys.exit(1)
          print(f"OK: {len(wheels)} wheel(s), {len(sdists)} sdist(s)")
          for f in sorted(dist.iterdir()):
              print(f"  {f.name}")

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: python/dist/
          retention-days: 7
